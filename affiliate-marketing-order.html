
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SEW - Admin Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { min-height: 100vh; background-color: var(--bg-body); color: var(--text-main); padding: 20px 16px; }
    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    .header-card {
      background: var(--card-bg); border-radius: 20px; padding: 20px;
      box-shadow: var(--shadow-soft); display: flex; justify-content: space-between;
      align-items: center; border: 1px solid var(--border-color);
    }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .stat-card { background: var(--card-bg); padding: 16px; border-radius: 16px; border: 1px solid var(--border-color); }
    .stat-card label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .stat-card .value { font-size: 22px; font-weight: 800; margin-top: 4px; }

    .requests-container { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--border-color); }
    .requests-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }

    .request-card {
      border: 1px solid var(--border-color); border-radius: 14px; padding: 16px;
      display: flex; flex-direction: column; gap: 12px; background: #fafafa;
    }
    @media(min-width: 600px) {
      .request-card { flex-direction: row; align-items: center; justify-content: space-between; }
    }

    .user-details h4 { font-size: 15px; font-weight: 800; color: var(--text-main); }
    .user-details p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .user-details .email-badge { background: #eff6ff; color: var(--primary); padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }

    .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 8px 14px; border-radius: 10px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; color: #fff; }
    .btn-view { background: var(--primary); }
    .btn-approve { background: var(--success); }
    .btn-reject { background: var(--danger); }

    /* Modal for Image Preview */
    .image-modal {
      display: none; position: fixed; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.85); z-index: 9999;
      justify-content: center; align-items: center; flex-direction: column; padding: 20px;
    }
    .image-modal img { max-width: 90%; max-height: 75vh; border-radius: 12px; border: 2px solid #fff; }
    .modal-close { margin-top: 15px; background: #ef4444; color: white; padding: 10px 20px; border-radius: 20px; font-weight: 700; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <h2 style="font-size: 18px; font-weight: 800;"><i class="fa-solid fa-user-shield"></i> Admin Ad Task Approvals</h2>
      <button class="btn btn-reject" onclick="location.reload()">Refresh Data</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <label>Pending Submissions</label>
        <div class="value" id="statPending" style="color: var(--warning);">0</div>
      </div>
      <div class="stat-card">
        <label>Total Registered Users</label>
        <div class="value" id="statUsers" style="color: var(--primary);">0</div>
      </div>
    </div>

    <div class="requests-container">
      <h3 style="font-size: 16px; font-weight: 700;">Task Submissions List</h3>
      <div class="requests-list" id="requestsList">
        <div style="text-align: center; padding: 30px; color: #64748b;">Loading task submissions...</div>
      </div>
    </div>
  </div>

  <!-- Image Viewer Modal -->
  <div class="image-modal" id="imageModal">
    <img id="fullImage" src="" alt="Screenshot Proof" />
    <button class="modal-close" onclick="closeModal()">Close Screenshot</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const imageCache = {};

    // Total Users Counter
    onValue(ref(db, 'users'), (snap) => {
      if (snap.exists()) {
        document.getElementById('statUsers').innerText = Object.keys(snap.val()).length;
      }
    });

    // Realtime Submissions Reader
    onValue(ref(db, 'ad_submissions'), (snapshot) => {
      const container = document.getElementById('requestsList');
      container.innerHTML = '';

      if (!snapshot.exists()) {
        document.getElementById('statPending').innerText = '0';
        container.innerHTML = `<div style="text-align: center; padding: 30px; color: #10b981; font-weight: 700;">Koi Pending Task Nahi Hai!</div>`;
        return;
      }

      const submissions = snapshot.val();
      const keys = Object.keys(submissions);
      document.getElementById('statPending').innerText = keys.length;

      keys.reverse().forEach((key) => {
        const sub = submissions[key];
        imageCache[key] = sub.screenshot;

        const card = document.createElement('div');
        card.className = 'request-card';
        const reward = parseFloat(sub.rewardAmount || 1.00).toFixed(2);
        const userEmail = sub.email || 'No Email Provided';

        card.innerHTML = `
          <div class="user-details">
            <h4>User: ${sub.username}</h4>
            <p>Email: <span class="email-badge">${userEmail}</span></p>
            <p style="margin-top: 4px;">Task: <strong>Ad #${sub.adIndex || 1}</strong> | Reward: <strong style="color: #10b981;">Rs. ${reward}</strong></p>
          </div>

          <div class="action-btns">
            <button class="btn btn-view" onclick="window.viewImage('${key}')">View Screenshot</button>
            <button class="btn btn-approve" onclick="window.approveTask('${key}', '${sub.username}', ${reward})">Approve (Rs. ${reward})</button>
            <button class="btn btn-reject" onclick="window.rejectTask('${key}')">Reject</button>
          </div>
        `;
        container.appendChild(card);
      });
    }, (error) => {
      document.getElementById('requestsList').innerHTML = `<div style="color:red; text-align:center;">Error: ${error.message}</div>`;
    });

    // View Screenshot Modal
    window.viewImage = function(key) {
      const imgData = imageCache[key];
      if (!imgData) {
        alert("Image data load nahi ho saki!");
        return;
      }
      document.getElementById('fullImage').src = imgData;
      document.getElementById('imageModal').style.display = 'flex';
    };

    window.closeModal = function() {
      document.getElementById('imageModal').style.display = 'none';
      document.getElementById('fullImage').src = '';
    };

    // Approve Task & Add Balance
    window.approveTask = async function(id, username, reward) {
      if (!confirm(`Kya aap ${username} ka task approve karke Rs. ${reward} unke account mein add karna chahte hain?`)) return;

      try {
        const userRef = ref(db, `users/${username}`);
        const userSnap = await get(userRef);

        if (userSnap.exists()) {
          const userData = userSnap.val();
          const currentBal = parseFloat(userData.balance || 0);
          const newBal = (currentBal + reward).toFixed(2);
          const completedAds = (userData.completedAdsCount || 0) + 1;

          // User Balance Update
          await update(userRef, {
            balance: newBal,
            completedAdsCount: completedAds
          });

          // Submission Delete from DB
          await remove(ref(db, `ad_submissions/${id}`));
          alert(`Rs. ${reward} successfully user balance mein add ho gaye!`);
        } else {
          alert("User record nahi mila!");
        }
      } catch (e) {
        alert("Approve Error: " + e.message);
      }
    };

    // Reject Task
    window.rejectTask = async function(id) {
      if (!confirm(`Kya aap is submission ko reject karna chahte hain?`)) return;

      try {
        await remove(ref(db, `ad_submissions/${id}`));
        alert("Task reject kar diya gaya.");
      } catch (e) {
        alert("Reject Error: " + e.message);
      }
    };
  </script>
</body>
</html>
