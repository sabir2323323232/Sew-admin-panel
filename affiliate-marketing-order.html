<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wipe Entire Firebase Database</title>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      max-width: 400px;
    }
    button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="color:#f87171;">⚠️ Danger Zone</h2>
    <p style="color:#94a3b8; font-size:14px; margin-top:10px;">
      Is button par click karne se aapke Firebase ka **TAMAM DATA** (Users, Orders, Products, Wallets) hamesha ke liye delete ho jayega.
    </p>
    <button onclick="wipeAllData()">Delete All Database Data</button>
    <p id="statusMsg" style="margin-top:15px; font-weight:bold;"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.wipeAllData = function() {
      const confirmCode = prompt("Tamam data delete karne ke liye 'DELETE' likhein:");
      
      if (confirmCode === "DELETE") {
        document.getElementById('statusMsg').innerText = "Deleting data...";
        
        // Root '/' ko remove karne se poora database delete ho jata hai
        remove(ref(db, '/'))
          .then(() => {
            document.getElementById('statusMsg').style.color = "#34d399";
            document.getElementById('statusMsg').innerText = "✅ Poora Firebase Database Bilkul Empty Ho Gaya!";
          })
          .catch((err) => {
            document.getElementById('statusMsg').style.color = "#f87171";
            document.getElementById('statusMsg').innerText = "Error: " + err.message;
          });
      } else {
        alert("Action Cancelled.");
      }
    };
  </script>
</body>
</html>
