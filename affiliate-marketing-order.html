
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SEW - Admin Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Firebase Compat SDK (Works everywhere without module errors) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --input-bg: #f1f5f9;
      --primary: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-soft: 0 20px 40px -15px rgba(0, 0, 0, 0.07);
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { min-height: 100vh; background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; padding: 20px 16px; }
    .container { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 16px; }

    .header-card {
      background: var(--card-bg); border-radius: 20px; padding: 18px 20px;
      box-shadow: var(--shadow-soft); display: flex; justify-content: space-between; align-items: center;
    }
    .header-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

    .stats-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff; border-radius: 20px; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .stats-count { font-size: 26px; font-weight: 800; color: var(--warning); }

    .review-card {
      background: var(--card-bg); border-radius: 20px; padding: 20px;
      box-shadow: var(--shadow-soft); display: flex; flex-direction: column; gap: 16px;
    }

    .user-info-box {
      background: var(--input-bg); border-radius: 14px; padding: 14px;
      display: flex; flex-direction: column; gap: 6px; font-size: 13px;
    }
    .info-row { display: flex; justify-content: space-between; align-items: center; }
    .info-label { color: var(--text-muted); font-weight: 600; }
    .info-value { font-weight: 700; color: var(--text-main); }

    .screenshot-container {
      width: 100%; height: 320px; background: #0f172a; border-radius: 14px;
      overflow: hidden; display: flex; justify-content: center; align-items: center;
      position: relative; border: 1px solid var(--border-color); cursor: pointer;
    }
    .screenshot-img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      padding: 14px; border-radius: 14px; border: none; font-size: 14px;
      font-weight: 800; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; transition: 0.2s ease;
    }
    .btn-approve { background: var(--success); color: #ffffff; }
    .btn-reject { background: var(--danger); color: #ffffff; }
    .btn-nav { background: var(--input-bg); color: var(--text-main); font-size: 13px; padding: 10px; }

    .empty-state {
      text-align: center; padding: 30px 20px; background: var(--card-bg);
      border-radius: 20px; color: var(--text-muted); font-weight: 700; box-shadow: var(--shadow-soft);
    }

    /* On-screen Console Log */
    .debug-box {
      background: #000000; color: #00ff66; padding: 12px; border-radius: 12px;
      font-family: monospace; font-size: 11px; max-height: 120px; overflow-y: auto;
      word-break: break-all; margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <div class="header-title">
        <i class="fa-solid fa-user-shield" style="color: var(--primary);"></i> Admin Panel
      </div>
      <button class="btn btn-nav" onclick="location.reload()">
        <i class="fa-solid fa-rotate"></i> Reload
      </button>
    </div>

    <div class="stats-card">
      <div>
        <div style="font-size: 12px; opacity: 0.8; font-weight: 600;">Pending Submissions</div>
        <div style="font-size: 14px; font-weight: 700;" id="queuePosText">Showing 0 of 0</div>
      </div>
      <div class="stats-count" id="totalPending">0</div>
    </div>

    <div id="mainContent">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 26px; margin-bottom: 10px; color: var(--primary);"></i>
        <p>Connecting to Firebase...</p>
      </div>
    </div>

    <!-- On-screen Status Log -->
    <div class="debug-box" id="debugLog">
      > Status Log Initialized...<br>
    </div>
  </div>

  <script>
    function logMessage(msg) {
      const log = document.getElementById('debugLog');
      if (log) {
        log.innerHTML += `> ${msg}<br>`;
        log.scrollTop = log.scrollHeight;
      }
      console.log(msg);
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    let db;
    let requestsList = [];
    let currentIndex = 0;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      logMessage("Firebase Connected Successfully.");
      initListener();
    } catch (err) {
      logMessage("Firebase Config Error: " + err.message);
    }

    function initListener() {
      db.ref('ad_submissions').on('value', (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          logMessage("Data fetched: " + Object.keys(data).length + " submissions found.");
          
          requestsList = Object.keys(data).map(key => ({
            id: key,
            ...data[key]
          }));

          requestsList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

          if (currentIndex >= requestsList.length) {
            currentIndex = Math.max(0, requestsList.length - 1);
          }

          renderCurrentRequest();
        } else {
          logMessage("No submissions exist in 'ad_submissions' path.");
          requestsList = [];
          renderEmptyState();
        }
      }, (error) => {
        logMessage("Database Access Error: " + error.message);
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state" style="color: var(--danger);">
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 32px; margin-bottom: 10px;"></i>
            <p><strong>Permission Denied!</strong></p>
            <p style="font-size: 12px; margin-top: 6px;">Firebase Rules check karein.</p>
          </div>`;
      });
    }

    function renderEmptyState() {
      document.getElementById('totalPending').innerText = "0";
      document.getElementById('queuePosText').innerText = "Showing 0 of 0";
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-circle-check" style="font-size: 36px; color: var(--success); margin-bottom: 12px;"></i>
          <p style="font-size: 16px;">Koi Pending Task Nahi Hai!</p>
          <p style="font-size: 12px; font-weight: 500; margin-top: 4px;">Jab user ad screenshot submit kare ga, yahan show hoga.</p>
        </div>`;
    }

    function renderCurrentRequest() {
      if (requestsList.length === 0) {
        renderEmptyState();
        return;
      }

      const item = requestsList[currentIndex];
      const total = requestsList.length;

      document.getElementById('totalPending').innerText = total;
      document.getElementById('queuePosText').innerText = `Request ${currentIndex + 1} of ${total}`;

      const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'N/A';
      
      // Image source resolution
      let imgSrc = 'https://via.placeholder.com/400x300?text=No+Image+Found';
      if (item.screenshot && item.screenshot.length > 50) {
        imgSrc = item.screenshot;
      }

      const html = `
        <div class="review-card">
          <div class="user-info-box">
            <div class="info-row">
              <span class="info-label"><i class="fa-solid fa-user"></i> Username:</span>
              <span class="info-value">${item.username || 'Unknown'}</span>
            </div>
            <div class="info-row" style="margin-top: 4px;">
              <span class="info-label"><i class="fa-solid fa-envelope"></i> Email:</span>
              <span class="info-value">${item.email || 'No Email'}</span>
            </div>
            <div class="info-row" style="margin-top: 4px;">
              <span class="info-label"><i class="fa-solid fa-rectangle-ad"></i> Task Details:</span>
              <span class="info-value">Ad #${item.adIndex || 1} (Rs. ${parseFloat(item.rewardAmount || 1).toFixed(2)})</span>
            </div>
            <div class="info-row" style="margin-top: 4px;">
              <span class="info-label"><i class="fa-solid fa-clock"></i> Time:</span>
              <span class="info-value">${dateStr}</span>
            </div>
          </div>

          <div class="screenshot-container" onclick="window.open('${imgSrc}')">
            <img class="screenshot-img" src="${imgSrc}" alt="Proof" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Load+Failed';" />
          </div>

          <div class="actions-grid">
            <button class="btn btn-approve" onclick="approveCurrent('${item.id}', '${item.username}', ${item.rewardAmount || 1})">
              <i class="fa-solid fa-check-circle"></i> Approve (+Rs. 1)
            </button>
            <button class="btn btn-reject" onclick="rejectCurrent('${item.id}')">
              <i class="fa-solid fa-xmark-circle"></i> Reject
            </button>
          </div>

          <div style="display: flex; gap: 10px; margin-top: 4px;">
            <button class="btn btn-nav" style="flex: 1;" ${currentIndex === 0 ? 'disabled style="opacity:0.5;"' : ''} onclick="navRequest(-1)">
              <i class="fa-solid fa-arrow-left"></i> Previous
            </button>
            <button class="btn btn-nav" style="flex: 1;" ${currentIndex === total - 1 ? 'disabled style="opacity:0.5;"' : ''} onclick="navRequest(1)">
              Next <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      `;

      document.getElementById('mainContent').innerHTML = html;
    }

    function navRequest(direction) {
      currentIndex += direction;
      renderCurrentRequest();
    }

    function approveCurrent(submissionId, username, reward) {
      if (!confirm(`Approve kar ke ${username} ko Rs. ${reward} add kar dein?`)) return;

      db.ref(`users/${username}`).once('value').then(userSnap => {
        if (userSnap.exists()) {
          const userData = userSnap.val();
          const currentBal = parseFloat(userData.balance || 0);
          const newBal = (currentBal + parseFloat(reward)).toFixed(2);
          const completedAds = (userData.completedAdsCount || 0) + 1;

          return db.ref(`users/${username}`).update({
            balance: newBal,
            completedAdsCount: completedAds
          });
        } else {
          throw new Error("User username database mein nahi mila!");
        }
      }).then(() => {
        return db.ref(`ad_submissions/${submissionId}`).remove();
      }).then(() => {
        logMessage("Approved submission ID: " + submissionId);
      }).catch(err => {
        alert("Action failed: " + err.message);
        logMessage("Approve error: " + err.message);
      });
    }

    function rejectCurrent(submissionId) {
      if (!confirm("Is submission ko reject/delete kar dein?")) return;

      db.ref(`ad_submissions/${submissionId}`).remove().then(() => {
        logMessage("Rejected submission ID: " + submissionId);
      }).catch(err => {
        alert("Reject failed: " + err.message);
      });
    }
  </script>
</body>
</html>
