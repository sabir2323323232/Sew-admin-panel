
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEW - Admin Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --shadow-soft: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { min-height: 100vh; background-color: var(--bg-body); padding: 20px; color: var(--text-main); }
    
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    .header { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-soft); }
    .header h1 { font-size: 20px; font-weight: 800; color: var(--primary); }
    
    .submissions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    
    .sub-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-soft); position: relative; }
    .user-info { font-weight: 700; font-size: 14px; }
    .user-info span { color: var(--text-muted); font-weight: 500; font-size: 12px; display: block; }
    
    .img-box { width: 100%; height: 200px; background: #f1f5f9; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: transform 0.2s; }
    .img-box img:hover { transform: scale(1.03); }

    .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
    .btn { padding: 10px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #ffffff; transition: opacity 0.2s; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-approve { background: var(--success); }
    .btn-reject { background: var(--danger); }

    /* Modal for Large Image Preview */
    .img-modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
    .img-modal img { max-width: 90%; max-height: 90vh; border-radius: 12px; }

    .no-data { text-align: center; color: var(--text-muted); padding: 40px; font-weight: 600; background: #ffffff; border-radius: 16px; border: 1px dashed var(--border-color); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1><i class="fa-solid fa-user-shield"></i> SEW Admin - Ad Approvals</h1>
      <span id="pendingCount" style="background: var(--primary); color: #fff; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 12px;">Pending: 0</span>
    </div>

    <div class="submissions-grid" id="submissionsContainer">
      <div class="no-data">Loading pending submissions...</div>
    </div>
  </div>

  <!-- Fullscreen Image Modal -->
  <div class="img-modal" id="imageModal" onclick="this.style.display='none'">
    <img id="fullImg" src="" alt="Full Screenshot" />
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, get, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Fetch All Pending Submissions
    onValue(ref(db, 'ad_submissions'), (snapshot) => {
      const container = document.getElementById('submissionsContainer');
      const pendingCount = document.getElementById('pendingCount');
      
      if (!snapshot.exists()) {
        container.innerHTML = `<div class="no-data" style="grid-column: 1/-1;">Koi pending screenshot nahi hai.</div>`;
        pendingCount.innerText = "Pending: 0";
        return;
      }

      const submissions = snapshot.val();
      const keys = Object.keys(submissions);
      pendingCount.innerText = `Pending: ${keys.length}`;
      container.innerHTML = '';

      keys.forEach((key) => {
        const item = submissions[key];
        const card = document.createElement('div');
        card.className = 'sub-card';
        card.innerHTML = `
          <div class="user-info">
            User: @${item.username}
            <span>Ad #${item.adIndex} | Reward: Rs. ${item.rewardAmount || 1.00}</span>
            <span style="font-size:10px; color:#94a3b8;">${new Date(item.timestamp).toLocaleString()}</span>
          </div>
          <div class="img-box">
            <img src="${item.screenshot}" alt="Screenshot" onclick="openFullImage('${item.screenshot}')" />
          </div>
          <div class="action-btns">
            <button class="btn btn-approve" id="btn-app-${key}" onclick="approveSubmission('${key}', '${item.username}', ${item.rewardAmount || 1.00})">
              <i class="fa-solid fa-check"></i> Approve
            </button>
            <button class="btn btn-reject" id="btn-rej-${key}" onclick="rejectSubmission('${key}')">
              <i class="fa-solid fa-xmark"></i> Reject
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    });

    // Approve Task
    window.approveSubmission = async function(key, username, rewardAmount) {
      const appBtn = document.getElementById(`btn-app-${key}`);
      const rejBtn = document.getElementById(`btn-rej-${key}`);
      appBtn.disabled = true;
      rejBtn.disabled = true;

      try {
        const userRef = ref(db, 'users/' + username);
        const userSnap = await get(userRef);

        if (userSnap.exists()) {
          const userData = userSnap.val();
          const currentBalance = parseFloat(userData.balance || 0);
          const currentCount = parseInt(userData.completedAdsCount || 0);

          // 1. User ka balance aur ads count update karein
          await update(userRef, {
            balance: currentBalance + parseFloat(rewardAmount),
            completedAdsCount: currentCount + 1
          });

          // 2. Request ko pending list se remove karein
          await remove(ref(db, 'ad_submissions/' + key));

          alert(`✅ @${username} ko Rs. ${rewardAmount} add ho chuke hain!`);
        } else {
          alert("❌ User record nahi mila!");
        }
      } catch (e) {
        alert("Error: " + e.message);
        appBtn.disabled = false;
        rejBtn.disabled = false;
      }
    };

    // Reject Task
    window.rejectSubmission = async function(key) {
      if(!confirm("Kya aap sach me is screenshot ko reject karna chahte hain?")) return;

      const appBtn = document.getElementById(`btn-app-${key}`);
      const rejBtn = document.getElementById(`btn-rej-${key}`);
      appBtn.disabled = true;
      rejBtn.disabled = true;

      try {
        await remove(ref(db, 'ad_submissions/' + key));
        alert("❌ Task reject aur remove kar diya gaya.");
      } catch (e) {
        alert("Error: " + e.message);
        appBtn.disabled = false;
        rejBtn.disabled = false;
      }
    };

    // Open Image Modal
    window.openFullImage = function(src) {
      document.getElementById('fullImg').src = src;
      document.getElementById('imageModal').style.display = 'flex';
    };
  </script>

</body>
</html>
