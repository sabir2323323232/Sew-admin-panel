
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEW - Complete Firebase Data Wipeout</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { min-height: 100vh; background-color: #0f172a; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 32px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .icon-box { font-size: 48px; color: #ef4444; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #f8fafc; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
    
    .danger-btn { width: 100%; background: #dc2626; color: #ffffff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .danger-btn:hover { background: #b91c1c; }
    .danger-btn:disabled { background: #64748b; cursor: not-allowed; }

    .status-box { margin-top: 20px; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; display: none; text-align: left; background: #0f172a; border: 1px solid #334155; max-height: 180px; overflow-y: auto; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-box"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h1>Firebase Data Eraser</h1>
    <p>Yeh tool aapke Realtime Database ka **sara data** (users, submissions, photos/screenshots) mita dega aur local sessions bhi reset kar dega.</p>

    <button class="danger-btn" id="wipeBtn" onclick="wipeAllData()">
      <i class="fa-solid fa-trash-can"></i> CLEAR ALL FIREBASE DATA
    </button>

    <div class="status-box" id="statusLog"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function log(msg, isError = false) {
      const logBox = document.getElementById('statusLog');
      logBox.style.display = 'block';
      const p = document.createElement('div');
      p.style.color = isError ? '#f87171' : '#4ade80';
      p.style.marginBottom = '4px';
      p.innerText = msg;
      logBox.appendChild(p);
      logBox.scrollTop = logBox.scrollHeight;
    }

    window.wipeAllData = async function() {
      const confirm1 = confirm("⚠️ KYA AAP SURE HAIN?\nFirebase ka SARA DATA permanently delete ho jayega!");
      if (!confirm1) return;

      const btn = document.getElementById('wipeBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Deleting Data...`;

      try {
        log("1. Cleaning Realtime Database root...");
        // Entire DB Wipeout
        await remove(ref(db, '/'));
        log("✅ Realtime Database fully cleared (Users + Screenshots).");

        log("2. Clearing Local Storage & Sessions...");
        localStorage.clear();
        sessionStorage.clear();
        log("✅ Local Storage cleared.");

        log("🎉 PROCEEDING COMPLETE: Aapka Firebase Database 100% Khali ho chuka hai!");
        alert("✅ Complete Data Deleted Successfully!");
      } catch (error) {
        log("❌ Error: " + error.message, true);
        alert("Error wiping data: " + error.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-trash-can"></i> CLEAR ALL FIREBASE DATA`;
      }
    };
  </script>

</body>
</html>
