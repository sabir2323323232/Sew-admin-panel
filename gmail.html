
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEW - Gmail Admin Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-body: #0f172a;
      --card-bg: #1e293b;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-gold: #f59e0b;
      --primary: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding: 15px; }

    .header {
      max-width: 800px;
      margin: 0 auto 15px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .header h2 { font-size: 16px; font-weight: 800; color: #ef4444; display: flex; align-items: center; gap: 8px; }

    .stats-bar {
      max-width: 800px;
      margin: 0 auto 15px auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .stat-card div:first-child { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .stat-card div:last-child { font-size: 18px; font-weight: 800; margin-top: 2px; }

    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

    .admin-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
    }

    .username { font-size: 12px; font-weight: 800; color: #93c5fd; }
    .date-txt { font-size: 10px; color: var(--text-muted); }

    .gmail-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 8px;
    }

    .detail-box label { font-size: 9px; color: var(--text-muted); display: block; font-weight: 700; }
    .detail-box span { font-size: 12px; font-weight: 700; color: #fff; word-break: break-all; }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-group { display: flex; gap: 8px; }

    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-approve { background: var(--accent-green); color: #fff; }
    .btn-reject { background: var(--accent-red); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .badge { font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
    .badge-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-approved { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-rejected { background: rgba(239, 68, 68, 0.2); color: #f87171; }
  </style>
</head>
<body>

  <div class="header">
    <h2><i class="fa-solid fa-user-shield"></i> Gmail Submissions Admin</h2>
    <div style="font-size:11px; font-weight:700; color:var(--text-muted);" id="liveStatus">Live Sync</div>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div>Total Submitted</div>
      <div id="totalCount">0</div>
    </div>
    <div class="stat-card">
      <div>Pending</div>
      <div id="pendingCount" style="color:#fbbf24;">0</div>
    </div>
    <div class="stat-card">
      <div>Approved</div>
      <div id="approvedCount" style="color:#34d399;">0</div>
    </div>
  </div>

  <div class="container" id="adminList">
    <div style="text-align:center; padding:20px; color:var(--text-muted);">Loading Submissions...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // FETCH ALL SUBMISSIONS
    onValue(ref(db, 'gmail_submissions'), (snapshot) => {
      const container = document.getElementById('adminList');

      if (!snapshot.exists()) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">Koi submission nahi mili.</div>`;
        document.getElementById('totalCount').innerText = "0";
        document.getElementById('pendingCount').innerText = "0";
        document.getElementById('approvedCount').innerText = "0";
        return;
      }

      const allData = snapshot.val();
      const keys = Object.keys(allData).reverse();

      let total = 0, pending = 0, approved = 0;
      let html = "";

      keys.forEach(key => {
        const item = allData[key];
        if (!item) return;

        total++;
        const status = item.status || 'Pending';
        if (status === 'Pending') pending++;
        if (status === 'Approved') approved++;

        let badgeClass = 'badge-pending';
        if (status === 'Approved') badgeClass = 'badge-approved';
        if (status === 'Rejected') badgeClass = 'badge-rejected';

        const formattedDate = item.createdAt ? new Date(item.createdAt).toLocaleString() : 'N/A';

        html += `
          <div class="admin-item" id="card-${key}">
            <div class="user-info-bar">
              <span class="username"><i class="fa-solid fa-user"></i> ${item.username || 'Unknown'}</span>
              <span class="date-txt"><i class="fa-regular fa-clock"></i> ${formattedDate}</span>
            </div>

            <div class="gmail-details">
              <div class="detail-box">
                <label>GMAIL ADDRESS</label>
                <span>${item.gmail || 'N/A'}</span>
              </div>
              <div class="detail-box">
                <label>PASSWORD</label>
                <span>${item.password || 'N/A'}</span>
              </div>
            </div>

            <div class="actions-bar">
              <span class="badge ${badgeClass}">${status}</span>
              ${status === 'Pending' ? `
                <div class="btn-group">
                  <button class="btn btn-approve" onclick="window.approveItem('${key}', '${item.username}', ${item.reward || 45})">
                    <i class="fa-solid fa-check"></i> Approve (+Rs. ${item.reward || 45})
                  </button>
                  <button class="btn btn-reject" onclick="window.rejectItem('${key}')">
                    <i class="fa-solid fa-xmark"></i> Reject
                  </button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      });

      document.getElementById('totalCount').innerText = total;
      document.getElementById('pendingCount').innerText = pending;
      document.getElementById('approvedCount').innerText = approved;

      container.innerHTML = html;
    }, (err) => {
      document.getElementById('adminList').innerHTML = `<div style="color:red; text-align:center;">Firebase Read Error: ${err.message}</div>`;
    });

    // APPROVE ACTION (Updates User Balance + Changes Status)
    window.approveItem = async (key, username, reward) => {
      if (!confirm(`Kya aap ${username} ko Rs. ${reward} add karna chahte hain?`)) return;

      try {
        const userRef = ref(db, `users/${username}`);
        const userSnap = await get(userRef);

        let currentBalance = 0;
        if (userSnap.exists()) {
          currentBalance = parseFloat(userSnap.val().balance || 0);
        }

        const newBalance = (currentBalance + parseFloat(reward)).toFixed(2);

        // Atomic multi-path update
        const updates = {};
        updates[`users/${username}/balance`] = newBalance;
        updates[`gmail_submissions/${key}/status`] = 'Approved';

        await update(ref(db), updates);
        alert(`Success! ${username} ko Rs. ${reward} mil gaye. Naya Balance: Rs. ${newBalance}`);

      } catch (e) {
        alert("Approve Error: " + e.message);
      }
    };

    // REJECT ACTION
    window.rejectItem = async (key) => {
      if (!confirm("Kya aap is Gmail ko Reject karna chahte hain?")) return;

      try {
        await update(ref(db, `gmail_submissions/${key}`), { status: 'Rejected' });
        alert("Submission Reject ho gayi hai.");
      } catch (e) {
        alert("Reject Error: " + e.message);
      }
    };
  </script>
</body>
</html>
