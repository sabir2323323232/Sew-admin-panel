
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEW Admin - User Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-body: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-green: #10b981;
      --accent-red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); padding: 12px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
    .header h2 { font-size: 18px; font-weight: 800; color: var(--primary); }
    .search-input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 12px; width: 100%; max-width: 300px; outline: none; }
    .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
    .user-card { background: #fff; border-radius: 10px; padding: 12px; border: 1px solid var(--border-color); }
    .user-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .avatar { width: 32px; height: 32px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
    .user-title h4 { font-size: 12px; font-weight: 700; }
    .user-title p { font-size: 10px; color: var(--text-muted); }
    .info-row { font-size: 11px; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .earning-edit-box { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-color); display: flex; gap: 6px; align-items: center; }
    .earning-input { width: 100px; padding: 5px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 11px; font-weight: 700; }
    .save-btn { background: var(--accent-green); color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .status-msg { padding: 12px; border-radius: 6px; font-size: 13px; font-weight: 600; background: #fff; border: 1px solid var(--border-color); }
    .error-msg { color: var(--accent-red); background: #fef2f2; border-color: #fca5a5; }
  </style>
</head>
<body>

  <div class="header">
    <h2><i class="fa-solid fa-users-gear"></i> User Management Admin</h2>
    <input type="text" id="userSearch" class="search-input" placeholder="Search user by name or mobile..." onkeyup="filterUsers()" />
  </div>

  <div id="statusBox" class="status-msg"><i class="fa-solid fa-spinner fa-spin"></i> Connecting to Firebase Realtime Database...</div>
  <div class="user-grid" id="userContainer" style="margin-top: 10px;"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let allUsersData = {};

    const statusBox = document.getElementById('statusBox');
    const container = document.getElementById('userContainer');

    // Realtime Listener with Error Handling
    onValue(ref(db, 'users'), (snapshot) => {
      if (!snapshot.exists()) {
        statusBox.style.display = "block";
        statusBox.className = "status-msg";
        statusBox.innerHTML = "<i class='fa-solid fa-circle-info'></i> 'users' node exists nahi karta ya koi user register nahi hua.";
        container.innerHTML = "";
        return;
      }

      statusBox.style.display = "none";
      allUsersData = snapshot.val();
      renderUsers(allUsersData);
    }, (error) => {
      statusBox.style.display = "block";
      statusBox.className = "status-msg error-msg";
      statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <strong>Firebase Error:</strong> ${error.message}<br><small>Aap apne Firebase Rules me read permission allow karein.</small>`;
    });

    function renderUsers(usersMap) {
      container.innerHTML = "";
      const searchVal = document.getElementById('userSearch').value.toLowerCase();

      let count = 0;
      Object.keys(usersMap).forEach(userKey => {
        const u = usersMap[userKey] || {};
        
        // Flexible field extraction
        const name = u.fullName || u.name || u.username || userKey;
        const mobile = u.mobile || u.phone || u.number || "N/A";
        const email = u.email || "N/A";
        const city = u.city || u.location || "";
        const country = u.country || "";
        const balance = u.balance !== undefined ? u.balance : (u.earning || 0);

        if (searchVal && !name.toLowerCase().includes(searchVal) && !mobile.toString().includes(searchVal)) {
          return;
        }

        count++;
        container.innerHTML += `
          <div class="user-card">
            <div class="user-card-header">
              <div class="avatar">${name.charAt(0).toUpperCase()}</div>
              <div class="user-title">
                <h4>${name}</h4>
                <p>Key/ID: ${userKey}</p>
              </div>
            </div>
            <div class="info-row"><span>Mobile:</span> <strong>${mobile}</strong></div>
            <div class="info-row"><span>Email:</span> <strong>${email}</strong></div>
            <div class="info-row"><span>City/Country:</span> <strong>${city} ${country}</strong></div>
            <div class="info-row"><span>Current Balance:</span> <strong style="color:var(--accent-green)">Rs. ${parseFloat(balance).toFixed(2)}</strong></div>

            <div class="earning-edit-box">
              <span style="font-size:10px; font-weight:700;">Edit Balance:</span>
              <input type="number" id="bal_${userKey}" class="earning-input" value="${balance}" step="any" />
              <button class="save-btn" onclick="updateUserBalance('${userKey}')">Save</button>
            </div>
          </div>
        `;
      });

      if (count === 0 && searchVal) {
        container.innerHTML = "<div class='status-msg'>No users match your search.</div>";
      }
    }

    window.filterUsers = function() {
      renderUsers(allUsersData);
    };

    window.updateUserBalance = function(userKey) {
      const newBal = document.getElementById(`bal_${userKey}`).value;
      if (newBal === "") return alert("Please enter a balance value.");

      update(ref(db, 'users/' + userKey), {
        balance: parseFloat(newBal)
      }).then(() => {
        alert(`Balance updated for ${userKey} successfully!`);
      }).catch((err) => {
        alert("Error updating balance: " + err.message);
      });
    };
  </script>
</body>
</html>
