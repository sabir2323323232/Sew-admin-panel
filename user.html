
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SEW - Admin Control Panel</title>

  <!-- CSS Framework & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- FIREBASE CLASSIC LIBRARIES (FAST & 100% RELIABLE) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-body: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 30px; }

    /* HEADER */
    .admin-header {
      background: #1e293b;
      border-bottom: 1px solid var(--border-color);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .brand { font-weight: 800; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .brand-badge { background: rgba(59, 130, 246, 0.2); color: var(--primary); padding: 2px 8px; border-radius: 12px; font-size: 10px; }

    /* STATS SUMMARY */
    .stats-container {
      max-width: 1100px; margin: 14px auto; padding: 0 12px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; text-align: center; }
    .stat-number { font-size: 20px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }

    /* TABS */
    .tabs-wrapper { max-width: 1100px; margin: 0 auto 14px auto; padding: 0 12px; display: flex; gap: 6px; }
    .tab-btn {
      flex: 1; background: var(--card-bg); border: 1px solid var(--border-color);
      color: var(--text-muted); padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* MAIN CONTENT */
    .main-content { max-width: 1100px; margin: 0 auto; padding: 0 12px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* SEARCH BAR */
    .search-filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .search-input {
      flex: 1; min-width: 200px; background: var(--card-bg); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 10px 12px; border-radius: 8px; font-size: 12px; outline: none;
    }
    .filter-select {
      background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 10px; border-radius: 8px; font-size: 12px; outline: none;
    }

    /* CARDS GRID */
    .users-grid, .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .data-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .user-avatar {
      width: 36px; height: 36px; background: var(--primary); color: #fff; font-weight: 800;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .details-box {
      background: var(--card-inner); border-radius: 6px; padding: 8px; font-size: 11px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .detail-row { display: flex; justify-content: space-between; }
    .detail-row span:first-child { color: var(--text-muted); }

    .action-btn {
      background: var(--primary); color: #fff; border: none; padding: 8px; border-radius: 6px;
      font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; width: 100%;
    }
    .action-btn:hover { background: var(--primary-hover); }

    .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .badge-pending { background: rgba(245, 158, 11, 0.2); color: var(--accent-orange); }
    .badge-ok { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
    .badge-cancelled { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

    /* MODAL */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
      display: none; justify-content: center; align-items: center; z-index: 200; padding: 12px;
    }
    .modal-box {
      background: var(--card-bg); width: 100%; max-width: 350px; border-radius: 12px;
      padding: 16px; border: 1px solid var(--border-color);
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 8px; background: var(--card-inner); border: 1px solid var(--border-color);
      color: #fff; border-radius: 6px; font-size: 12px; outline: none;
    }
    .quick-btns { display: flex; gap: 4px; margin-bottom: 10px; }
    .quick-btns button {
      flex: 1; background: var(--card-inner); border: 1px solid var(--border-color);
      color: #fff; padding: 6px; font-size: 10px; font-weight: 700; border-radius: 4px; cursor: pointer;
    }
    .save-btn { width: 100%; padding: 10px; background: var(--accent-green); color: #fff; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; }

    .no-data { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="admin-header">
    <div class="brand"><i class="fa-solid fa-user-shield"></i> SEW Admin <span class="brand-badge">Live Panel</span></div>
  </header>

  <!-- STATS -->
  <div class="stats-container">
    <div class="stat-card">
      <div class="stat-number" id="statUsers">0</div>
      <div class="stat-label">Total Users</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="statOrders">0</div>
      <div class="stat-label">Total Orders</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="statPending" style="color:var(--accent-orange)">0</div>
      <div class="stat-label">Pending Orders</div>
    </div>
  </div>

  <!-- NAVIGATION TABS -->
  <div class="tabs-wrapper">
    <button class="tab-btn active" onclick="switchTab('usersTab', this)">
      <i class="fa-solid fa-users"></i> Registered Users
    </button>
    <button class="tab-btn" onclick="switchTab('ordersTab', this)">
      <i class="fa-solid fa-cart-shopping"></i> Market Orders
    </button>
    <button class="tab-btn" onclick="switchTab('productsTab', this)">
      <i class="fa-solid fa-plus-circle"></i> Add Product
    </button>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="main-content">

    <!-- TAB 1: USERS MANAGEMENT -->
    <div id="usersTab" class="tab-content active">
      <div class="search-filter-bar">
        <input type="text" id="userSearchInput" class="search-input" placeholder="Search user by name, username, mobile, email..." oninput="renderUsers()" />
      </div>
      <div class="users-grid" id="usersGrid">
        <div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> Connecting to Firebase Database...</div>
      </div>
    </div>

    <!-- TAB 2: MARKET ORDERS -->
    <div id="ordersTab" class="tab-content">
      <div class="search-filter-bar">
        <input type="text" id="orderSearchInput" class="search-input" placeholder="Search order by customer, product, phone..." oninput="renderOrders()" />
        <select id="orderStatusFilter" class="filter-select" onchange="renderOrders()">
          <option value="all">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="OK">OK / Confirmed</option>
          <option value="Delivered">Delivered</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>
      <div class="orders-grid" id="ordersGrid">
        <div class="no-data">Loading market orders...</div>
      </div>
    </div>

    <!-- TAB 3: ADD PRODUCTS -->
    <div id="productsTab" class="tab-content">
      <div style="background:var(--card-bg); padding:16px; border-radius:10px; border:1px solid var(--border-color); max-width:500px; margin:0 auto;">
        <h3 style="font-size:14px; margin-bottom:12px; color:var(--primary);"><i class="fa-solid fa-box"></i> Add Market Product</h3>
        <form id="addProductForm" onsubmit="handleAddProduct(event)">
          <div class="form-group">
            <label>Product Title</label>
            <input type="text" id="pName" placeholder="e.g. Wireless Headphones" required />
          </div>
          <div class="form-group">
            <label>Price (PKR)</label>
            <input type="number" id="pPrice" placeholder="e.g. 1200" required />
          </div>
          <div class="form-group">
            <label>Image Link (URL)</label>
            <input type="url" id="pImage" placeholder="https://..." required />
          </div>
          <div class="form-group">
            <label>Details / Description</label>
            <textarea id="pDetails" rows="3" placeholder="Enter product specs..." required></textarea>
          </div>
          <button type="submit" class="save-btn" id="saveProdBtn">Publish Product to Market</button>
        </form>

        <h4 style="font-size:12px; margin:16px 0 8px 0;">Published Products</h4>
        <div id="productsList" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </div>

  </div>

  <!-- EDIT BALANCE MODAL -->
  <div class="modal-overlay" id="editBalanceModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:14px;">Edit User Earning / Balance</h3>
        <button onclick="closeBalanceModal()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:16px;">✕</button>
      </div>
      <p style="font-size:11px; margin-bottom:10px; color:var(--text-muted);" id="modalUserText">Target User: -</p>
      
      <div class="form-group">
        <label>Current Earning / Balance (PKR)</label>
        <input type="number" step="0.01" id="newBalanceInput" placeholder="0.00" />
      </div>

      <div class="quick-btns">
        <button onclick="quickAdd(100)">+100</button>
        <button onclick="quickAdd(500)">+500</button>
        <button onclick="quickAdd(1000)">+1000</button>
        <button onclick="quickAdd(-100)">-100</button>
      </div>

      <button class="save-btn" onclick="saveUserBalance()">Update Balance Now</button>
    </div>
  </div>

  <!-- FIREBASE ENGINE SCRIPT -->
  <script>
    // 1. FIREBASE INITIALIZATION
    const firebaseConfig = {
      apiKey: "AIzaSyAsnATksiqZzMHOPO64i_bKqLJW6yjq9lw",
      authDomain: "newweb-d50af.firebaseapp.com",
      databaseURL: "https://newweb-d50af-default-rtdb.firebaseio.com",
      projectId: "newweb-d50af",
      storageBucket: "newweb-d50af.firebasestorage.app",
      messagingSenderId: "358603295768",
      appId: "1:358603295768:web:82a9666514a7cb468c476d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let globalUsers = {};
    let globalOrders = {};
    let globalProducts = {};
    let currentEditUserKey = null;

    // 2. TAB SWITCHING FUNCTION
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      if (btnElement) btnElement.classList.add('active');
    }

    // 3. LISTEN TO USERS FROM DATABASE
    db.ref('users').on('value', (snapshot) => {
      globalUsers = snapshot.val() || {};
      const userKeys = Object.keys(globalUsers);
      document.getElementById('statUsers').innerText = userKeys.length;
      renderUsers();
    }, (error) => {
      document.getElementById('usersGrid').innerHTML = `<div class="no-data" style="color:#ef4444">Firebase Error: ${error.message}. Check Database Rules!</div>`;
    });

    // 4. LISTEN TO ORDERS FROM DATABASE
    db.ref('orders').on('value', (snapshot) => {
      globalOrders = snapshot.val() || {};
      const orderKeys = Object.keys(globalOrders);
      document.getElementById('statOrders').innerText = orderKeys.length;

      let pending = 0;
      orderKeys.forEach(k => {
        if ((globalOrders[k].status || '').toLowerCase() === 'pending') pending++;
      });
      document.getElementById('statPending').innerText = pending;

      renderOrders();
    }, (error) => {
      document.getElementById('ordersGrid').innerHTML = `<div class="no-data" style="color:#ef4444">Firebase Error: ${error.message}</div>`;
    });

    // 5. LISTEN TO PRODUCTS FROM DATABASE
    db.ref('products').on('value', (snapshot) => {
      globalProducts = snapshot.val() || {};
      renderProducts();
    });

    // 6. RENDER USERS LIST
    function renderUsers() {
      const grid = document.getElementById('usersGrid');
      grid.innerHTML = "";

      const query = (document.getElementById('userSearchInput').value || '').toLowerCase().trim();
      const keys = Object.keys(globalUsers);

      if (keys.length === 0) {
        grid.innerHTML = `<div class="no-data">No registered users found in Database path ("users").</div>`;
        return;
      }

      let count = 0;
      keys.forEach(userKey => {
        const u = globalUsers[userKey] || {};
        const name = u.fullName || u.username || userKey;
        const email = u.email || 'N/A';
        const mobile = u.mobile || u.phone || 'N/A';
        const balance = u.balance !== undefined ? u.balance : "0.00";
        const city = u.city || 'N/A';

        const match = name.toLowerCase().includes(query) ||
                      userKey.toLowerCase().includes(query) ||
                      mobile.toLowerCase().includes(query) ||
                      email.toLowerCase().includes(query);

        if (match) {
          count++;
          const initial = name.charAt(0).toUpperCase();

          grid.innerHTML += `
            <div class="data-card">
              <div style="display:flex; align-items:center; gap:10px;">
                <div class="user-avatar">${initial}</div>
                <div>
                  <h4 style="font-size:13px;">${name}</h4>
                  <p style="font-size:10px; color:var(--text-muted)">@${userKey}</p>
                </div>
              </div>

              <div class="details-box">
                <div class="detail-row"><span>Mobile:</span> <strong>${mobile}</strong></div>
                <div class="detail-row"><span>Email:</span> <strong>${email}</strong></div>
                <div class="detail-row"><span>City:</span> <strong>${city}</strong></div>
                <div class="detail-row">
                  <span>Current Earning:</span>
                  <strong style="color:var(--accent-green); font-size:12px;">Rs. ${balance}</strong>
                </div>
              </div>

              <button class="action-btn" onclick="openBalanceModal('${userKey}')">
                <i class="fa-solid fa-pen-to-square"></i> Edit User Balance
              </button>
            </div>
          `;
        }
      });

      if (count === 0) {
        grid.innerHTML = `<div class="no-data">No user matches "${query}"</div>`;
      }
    }

    // 7. EDIT BALANCE MODAL HANDLERS
    function openBalanceModal(userKey) {
      currentEditUserKey = userKey;
      const u = globalUsers[userKey] || {};
      document.getElementById('modalUserText').innerHTML = `User: <strong>${u.fullName || userKey}</strong> (@${userKey})`;
      document.getElementById('newBalanceInput').value = u.balance !== undefined ? u.balance : "0.00";
      document.getElementById('editBalanceModal').style.display = 'flex';
    }

    function closeBalanceModal() {
      document.getElementById('editBalanceModal').style.display = 'none';
      currentEditUserKey = null;
    }

    function quickAdd(val) {
      const input = document.getElementById('newBalanceInput');
      let current = parseFloat(input.value) || 0;
      current += val;
      if (current < 0) current = 0;
      input.value = current.toFixed(2);
    }

    function saveUserBalance() {
      if (!currentEditUserKey) return;
      const newBal = document.getElementById('newBalanceInput').value || "0.00";

      db.ref('users/' + currentEditUserKey).update({
        balance: newBal
      }).then(() => {
        alert("Balance successfully updated to Rs. " + newBal);
        closeBalanceModal();
      }).catch((err) => {
        alert("Update Error: " + err.message);
      });
    }

    // 8. RENDER MARKET ORDERS
    function renderOrders() {
      const grid = document.getElementById('ordersGrid');
      grid.innerHTML = "";

      const query = (document.getElementById('orderSearchInput').value || '').toLowerCase().trim();
      const statusFilter = document.getElementById('orderStatusFilter').value;
      const keys = Object.keys(globalOrders).reverse();

      if (keys.length === 0) {
        grid.innerHTML = `<div class="no-data">No orders placed in Database path ("orders").</div>`;
        return;
      }

      let count = 0;
      keys.forEach(oKey => {
        const ord = globalOrders[oKey] || {};
        const pName = ord.productName || ord.title || 'Product Order';
        const customer = ord.customerName || ord.username || 'Customer';
        const mobile = ord.customerMobile || ord.mobile || '';
        const qty = ord.quantity || 1;
        const total = ord.totalPrice || ord.price || 0;
        const status = ord.status || 'Pending';
        const location = ord.customerLocation || ord.address || 'N/A';

        const matchQuery = pName.toLowerCase().includes(query) || customer.toLowerCase().includes(query) || mobile.toLowerCase().includes(query);
        const matchStatus = statusFilter === 'all' || status.toLowerCase() === statusFilter.toLowerCase();

        if (matchQuery && matchStatus) {
          count++;
          let badgeClass = 'badge-pending';
          if (status.toLowerCase() === 'ok' || status.toLowerCase() === 'delivered') badgeClass = 'badge-ok';
          if (status.toLowerCase() === 'cancelled') badgeClass = 'badge-cancelled';

          const cleanMobile = mobile.replace(/[^0-9]/g, '');

          grid.innerHTML += `
            <div class="data-card">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <h4 style="font-size:13px; color:var(--primary);">${pName}</h4>
                <span class="badge ${badgeClass}">${status}</span>
              </div>

              <div class="details-box">
                <div class="detail-row"><span>Customer:</span> <strong>${customer}</strong></div>
                <div class="detail-row"><span>Mobile:</span> <strong>${mobile}</strong></div>
                <div class="detail-row"><span>Address:</span> <strong>${location}</strong></div>
                <div class="detail-row"><span>Quantity:</span> <strong>${qty} item(s)</strong></div>
                <div class="detail-row">
                  <span>Total Bill:</span>
                  <strong style="color:var(--accent-green); font-size:12px;">Rs. ${total}</strong>
                </div>
              </div>

              <div style="display:flex; gap:6px;">
                ${cleanMobile ? `
                  <a href="https://wa.me/${cleanMobile}" target="_blank" 
                     style="background:#25d366; color:#fff; text-decoration:none; padding:8px; border-radius:6px; font-size:11px; font-weight:700; text-align:center; display:flex; align-items:center; justify-content:center; gap:4px;">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                  </a>
                ` : ''}

                <select style="flex:1; background:var(--card-inner); color:#fff; border:1px solid var(--border-color); padding:6px; border-radius:6px; font-size:11px; outline:none;"
                        onchange="updateOrderStatus('${oKey}', this.value)">
                  <option value="" disabled selected>Change Status...</option>
                  <option value="Pending">Pending</option>
                  <option value="OK">OK / Confirmed</option>
                  <option value="Delivered">Delivered</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
              </div>
            </div>
          `;
        }
      });

      if (count === 0) {
        grid.innerHTML = `<div class="no-data">No orders found matching criteria.</div>`;
      }
    }

    // 9. UPDATE ORDER STATUS
    function updateOrderStatus(orderId, newStatus) {
      if (!orderId || !newStatus) return;
      db.ref('orders/' + orderId).update({
        status: newStatus
      }).then(() => {
        alert("Order Status Updated to: " + newStatus);
      }).catch(err => {
        alert("Failed to update status: " + err.message);
      });
    }

    // 10. ADD PRODUCT TO MARKET
    function handleAddProduct(e) {
      e.preventDefault();
      const btn = document.getElementById('saveProdBtn');
      btn.disabled = true;
      btn.innerText = "Publishing...";

      const newProd = {
        name: document.getElementById('pName').value,
        price: parseFloat(document.getElementById('pPrice').value) || 0,
        image: document.getElementById('pImage').value,
        details: document.getElementById('pDetails').value,
        timestamp: Date.now()
      };

      db.ref('products').push(newProd).then(() => {
        alert("New product published successfully!");
        document.getElementById('addProductForm').reset();
      }).catch(err => {
        alert("Product Error: " + err.message);
      }).finally(() => {
        btn.disabled = false;
        btn.innerText = "Publish Product to Market";
      });
    }

    // 11. RENDER PUBLISHED PRODUCTS LIST
    function renderProducts() {
      const container = document.getElementById('productsList');
      container.innerHTML = "";
      const keys = Object.keys(globalProducts);

      if (keys.length === 0) {
        container.innerHTML = `<div class="no-data" style="padding:10px;">No products added yet.</div>`;
        return;
      }

      keys.forEach(pId => {
        const p = globalProducts[pId] || {};
        container.innerHTML += `
          <div style="background:var(--card-inner); padding:8px 10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; font-size:11px;">
            <div>
              <strong>${p.name || 'Item'}</strong> - <span style="color:var(--accent-green)">Rs. ${p.price || 0}</span>
            </div>
            <button onclick="deleteProduct('${pId}')" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">
              Delete
            </button>
          </div>
        `;
      });
    }

    function deleteProduct(pId) {
      if (confirm("Delete this product from Market?")) {
        db.ref('products/' + pId).remove().catch(err => alert("Delete Error: " + err.message));
      }
    }
  </script>
</body>
</html>
